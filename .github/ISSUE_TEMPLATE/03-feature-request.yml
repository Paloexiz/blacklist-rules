name: Feature request
description: Suggest a new format, upstream source, or other improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: feature-type
    attributes:
      label: What kind of improvement?
      options:
        - Support another client or rule format
        - Add an upstream rule list
        - Improve scripts or automation
        - Improve documentation
        - Something else
    validations:
      required: true
  - type: input
    id: desired-outcome
    attributes:
      label: What would you like to see?
      description: A name, public link, or one sentence is enough.
      placeholder: "For example: support rules from https://example.com/rules."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Anything else? (optional)
      description: Add a public link or example if you have one. Please leave out passwords, tokens, and private subscription URLs.
