name: Sync Third-Party Rules

on:
  schedule:
    # Daily at 03:23 Hong Kong / Beijing time (UTC+8), 19:23 UTC on the previous day.
    - cron: "23 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workflow_scripts/sync_third_party_rules.py"
      - "workflow_scripts/build_rules.py"
      - ".github/workflows/sync-third-party-rules.yml"
  pull_request:
    paths:
      - "workflow_scripts/sync_third_party_rules.py"
      - "workflow_scripts/build_rules.py"
      - ".github/workflows/sync-third-party-rules.yml"
      - "third_party/**"

permissions:
  contents: read

concurrency:
  group: third-party-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Mihomo for native MRS validation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-agent-mihomo"
          curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          echo "ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20  $RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" | sha256sum --check -
          gzip -dc "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" > "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          chmod +x "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          echo "MIHOMO_BIN=$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo" >> "$GITHUB_ENV"
      - name: Check conversion and failure retention
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python workflow_scripts/sync_third_party_rules.py --self-test

  sync:
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Mihomo for native MRS validation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-agent-mihomo"
          curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz
          echo "ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20  $RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" | sha256sum --check -
          gzip -dc "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo.gz" > "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          chmod +x "$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo"
          echo "MIHOMO_BIN=$RUNNER_TEMP/ai-agent-mihomo/ai-agent-mihomo" >> "$GITHUB_ENV"
      - name: Sync and convert third-party rules
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python workflow_scripts/sync_third_party_rules.py
      - name: Commit generated rules
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- third_party/clash third_party/surge third_party/sing-box third_party/sources.json third_party/README.md third_party/README.zh-cn.md client_conf/mihomo_configuration/mihomo_configuration.yaml client_conf/mihomo_override/mihomo_override.js client_conf/surge_configuration/surge_configuration.conf)" ]; then
            echo "Third-party rules are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- third_party
          git add -- client_conf/mihomo_configuration/mihomo_configuration.yaml client_conf/mihomo_override/mihomo_override.js client_conf/surge_configuration/surge_configuration.conf
          git commit -m "chore: sync third-party rules"
          git push
