name: Sync Third-Party Rules

on:
  schedule:
    # Daily at 03:23 Hong Kong / Beijing time (UTC+8), 19:23 UTC on the previous day.
    - cron: "23 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workflow_scripts/sync_third_party_rules.py"
      - "workflow_scripts/build_rules.py"
      - ".github/workflows/sync-third-party-rules.yml"
  pull_request:
    paths:
      - "workflow_scripts/sync_third_party_rules.py"
      - "workflow_scripts/build_rules.py"
      - ".github/workflows/sync-third-party-rules.yml"
      - "third_party/**"

permissions:
  contents: read

concurrency:
  group: third-party-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check conversion and failure retention
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python workflow_scripts/sync_third_party_rules.py --self-test

  sync:
    needs: validate
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Sync and convert third-party rules
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python workflow_scripts/sync_third_party_rules.py
      - name: Commit generated rules
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- third_party/clash third_party/surge third_party/sing-box third_party/sources.json)" ]; then
            echo "Third-party rules are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/clash third_party/surge third_party/sing-box third_party/sources.json
          git commit -m "chore: sync third-party rules"
          git push
